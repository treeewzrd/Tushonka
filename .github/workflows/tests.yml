
name: Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secure_api_user
          POSTGRES_PASSWORD: github-test-password
          POSTGRES_DB: tushonka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure_api_user -d tushonka_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      JWT_SECRET_KEY: github-actions-only-test-signing-key-2026
      DATABASE_URL: sqlite://
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://secure_api_user:github-test-password@localhost:5432/tushonka_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q
