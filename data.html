<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recent RAID reports</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/history.css">
  <script type="module" src="js/history.js"></script>
</head>
<body>
  <div class="container">
    <h1 class="title">MAYBE THEY WERE JUST BETTER!?</h1>
    <p id="history-message" role="status"></p>
    <button id="retry-history" class="button" type="button" hidden>
      Retry
    </button>
    <div id="results" class="results-grid"></div>

    <div class="pagination">
      <button class="button is-medium" id="previous-page" aria-label="Newer entries">NEWER ENTRIES</button>
      <span id="page-indicator" class="current-page"></span>
      <button class="button is-medium" id="next-page" aria-label="Older entries">OLDER ENTRIES</button>
    </div>

    <div class="buttons is-centered">
      <a class="button is-medium" href="index.html">BACK TO TITLE PAGE</a>
      <a class="button is-medium" href="results.html">Your RAID statistics</a>
    </div>
  </div>
</body>
</html>
